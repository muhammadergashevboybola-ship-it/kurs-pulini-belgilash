
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPay - To‘lov nazorati</title>

    
</head>
<body>
  <div class="container">
    <header>
      <h1>EduPay</h1>
      <p>O‘quvchilar to‘lovini boshqarish tizimi</p>
      <div id="dateTime"></div>
    </header>

    <section class="form-box">
      <h2>Yangi o‘quvchi qo‘shish</h2>
      <form id="studentForm">
        <input id="studentName" type="text"
          placeholder="O‘quvchi ismi" required>

        <input id="studentPrice" type="number"
          placeholder="Kurs narxi (so‘m)" min="0" required>

        <button type="submit">O‘quvchi qo‘shish</button>
      </form>
    </section>

    <section class="stats">
      <div class="stat">
        <h3 id="totalCount">0</h3>
        <p>Jami o‘quvchilar</p>
      </div>

      <div class="stat">
        <h3 id="paidCount">0</h3>
        <p>To‘laganlar</p>
      </div>

      <div class="stat">
        <h3 id="unpaidCount">0</h3>
        <p>To‘lamaganlar</p>
      </div>

      <div class="stat">
        <h3 id="totalMoney">0</h3>
        <p>Jami tushgan pul (so‘m)</p>
      </div>
    </section>

    <section class="students-box">
      <h2>O‘quvchilar ro‘yxati</h2>

      <input id="searchInput" type="search"
        placeholder="Ism bo‘yicha qidirish...">

      <select id="filterSelect">
        <option value="all">Barcha o‘quvchilar</option>
        <option value="paid">To‘laganlar</option>
        <option value="unpaid">To‘lamaganlar</option>
      </select>

      <div id="studentList" class="student-list"></div>
    </section>
  </div>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #1e293b;
      padding: 25px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #312e81;
      color: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    header h1 {
      margin-bottom: 8px;
    }

    #dateTime {
      margin-top: 12px;
    }

    .form-box, .stats, .students-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    input, select, button {
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      margin: 5px 5px 5px 0;
      max-width: 100%;
    }

    button {
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      margin: 4px;
    }

    button:hover {
      opacity: 0.85;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 15px;
    }

    .stat {
      text-align: center;
      min-width: 130px;
    }

    .stat h3 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .student {
      padding: 18px;
      border: 2px solid transparent;
      border-radius: 12px;
      transition: background-color 0.2s;
    }

    /* To‘lagan, oyning 1–14-kunlari */
    .student.paid {
      background: #dcfce7;
      border-color: #22c55e;
    }

    /* To‘lamagan o‘quvchi */
    .student.unpaid {
      background: #fee2e2;
      border-color: #ef4444;
    }

    /* To‘lagan, oyning 15-kunidan boshlab */
    .student.paid-late {
      background: #fef9c3;
      border-color: #eab308;
    }

    .student h3 {
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .student p {
      margin: 7px 0;
    }

    .status {
      font-weight: bold;
    }

    .paid-btn {
      background: #16a34a;
    }

    .unpaid-btn {
      background: #dc2626;
    }

    .delete-btn {
      background: #475569;
    }

    .empty {
      color: #64748b;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      header, .form-box, .students-box, .stats {
        padding: 15px;
      }

      input, select {
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>


  <script>
    const STORAGE_KEY = "edupay_students_final";

    let students = [];

    try {
      students = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (error) {
      students = [];
    }

    const studentForm = document.getElementById("studentForm");
    const studentName = document.getElementById("studentName");
    const studentPrice = document.getElementById("studentPrice");
    const studentList = document.getElementById("studentList");
    const searchInput = document.getElementById("searchInput");
    const filterSelect = document.getElementById("filterSelect");

    function saveStudents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    }

    // Rangni o‘quvchining to‘lov holati va sana bo‘yicha aniqlaymiz.
    function getStudentStatus(student) {
      if (!student.paid) {
        return "unpaid";
      }

      const day = new Date().getDate();

      if (day >= 15) {
        return "paid-late";
      }

      return "paid";
    }

    function renderStudents() {
      const search = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      studentList.innerHTML = "";

      const filteredStudents = students.filter(student => {
        const matchesSearch =
          student.name.toLowerCase().includes(search);

        const matchesFilter =
          filter === "all" ||
          (filter === "paid" && student.paid) ||
          (filter === "unpaid" && !student.paid);

        return matchesSearch && matchesFilter;
      });

      if (filteredStudents.length === 0) {
        studentList.innerHTML =
          '<p class="empty">O‘quvchilar topilmadi.</p>';
      }

      filteredStudents.forEach(student => {
        const status = getStudentStatus(student);
        const card = document.createElement("div");

        card.className = `student ${status}`;

        const name = document.createElement("h3");
        name.textContent = student.name;

        const price = document.createElement("p");
        price.textContent =
          "Kurs narxi: " +
          Number(student.price).toLocaleString("uz-UZ") +
          " so‘m";

        const statusLine = document.createElement("p");
        statusLine.className = "status";

        if (!student.paid) {
          statusLine.textContent = "Holati: To‘lanmagan";
        } else if (status === "paid-late") {
          statusLine.textContent =
            "Holati: To‘langan — 15-kundan keyingi rang";
        } else {
          statusLine.textContent = "Holati: To‘langan";
        }

        const paidButton = document.createElement("button");
        paidButton.className = "paid-btn";
        paidButton.textContent = "To‘ladi";
        paidButton.addEventListener("click", () => {
          updatePayment(student.id, true);
        });

        const unpaidButton = document.createElement("button");
        unpaidButton.className = "unpaid-btn";
        unpaidButton.textContent = "To‘lamadi";
        unpaidButton.addEventListener("click", () => {
          updatePayment(student.id, false);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "O‘chirish";
        deleteButton.addEventListener("click", () => {
          deleteStudent(student.id);
        });

        card.append(
          name,
          price,
          statusLine,
          paidButton,
          unpaidButton,
          deleteButton
        );

        studentList.appendChild(card);
      });

      updateStats();
    }

    function updatePayment(id, paid) {
      students = students.map(student =>
        student.id === id
          ? { ...student, paid: paid }
          : student
      );

      saveStudents();
      renderStudents();
    }

    function deleteStudent(id) {
      students = students.filter(student => student.id !== id);
      saveStudents();
      renderStudents();
    }

    function updateStats() {
      document.getElementById("totalCount").textContent =
        students.length;

      document.getElementById("paidCount").textContent =
        students.filter(student => student.paid).length;

      document.getElementById("unpaidCount").textContent =
        students.filter(student => !student.paid).length;

      const paidMoney = students
        .filter(student => student.paid)
        .reduce(
          (sum, student) => sum + Number(student.price),
          0
        );

      document.getElementById("totalMoney").textContent =
        paidMoney.toLocaleString("uz-UZ");
    }

    studentForm.addEventListener("submit", event => {
      event.preventDefault();

      const name = studentName.value.trim();
      const priceValue = studentPrice.value;
      const price = Number(priceValue);

      if (!name || priceValue === "" || !Number.isFinite(price) || price < 0) {
        alert("Ism va kurs narxini to‘g‘ri kiriting!");
        return;
      }

      students.push({
        id: Date.now(),
        name: name,
        price: price,
        paid: false
      });

      saveStudents();
      studentForm.reset();
      renderStudents();
    });

    searchInput.addEventListener("input", renderStudents);
    filterSelect.addEventListener("change", renderStudents);

    function updateDateTime() {
      const now = new Date();

      const date = now.toLocaleDateString("en-US", {
        month: "2-digit",
        day: "2-digit",
        year: "numeric"
      });

      const time = now.toLocaleTimeString("en-GB", {
        hour12: false
      });

      document.getElementById("dateTime").textContent =
        date + " | " + time;
    }

    updateDateTime();
    renderStudents();

    setInterval(updateDateTime, 1000);

    setInterval(renderStudents, 60000);
  </script>
</body>
</html>
